<main class="sst-layout">
  
  <header class="sst-header">
    <hgroup class="sst-header__titles">
      <p class="sst-header__breadcrumb">SGSST / Área do Colaborador</p>
      <h1 class="sst-header__main">Ajuda e Suporte</h1>
    </hgroup>
  </header>

  <div class="sst-grid" style="grid-template-columns: 1fr 2fr; gap: 1.5rem;">
    
    <!-- Nova Solicitação -->
    <section class="sst-card sst-card--form">
      <header class="sst-card__toolbar">
        <h2 class="sst-card__title">Nova solicitação</h2>
      </header>

      <form (ngSubmit)="handleSubmit()" class="sst-form-grid">
        <div class="sst-form-group sst-col-span-2">
          <label for="ticketType">Tipo</label>
          <select id="ticketType" name="type" [(ngModel)]="ticketType" class="sst-search__input sst-input-full" required>
            <option value="Solicitar Ajuda">Solicitar Ajuda</option>
            <option value="Reportar Problema">Reportar Problema</option>
            <option value="Outros">Outros</option>
          </select>
        </div>

        <div class="sst-form-group sst-col-span-2">
          <label for="ticketDescription">Descrição</label>
          <textarea 
            id="ticketDescription" 
            name="description" 
            [(ngModel)]="ticketDescription"
            placeholder="Descreva sua dúvida ou problema" 
            rows="4" 
            class="sst-search__input sst-input-full"
            style="resize: vertical; min-height: 100px;"
            required
          ></textarea>
        </div>

        <footer class="sst-form-actions sst-col-span-2">
          <button type="submit" class="sst-btn sst-btn--dark sst-input-full">Enviar solicitação</button>
        </footer>
      </form>
    </section>

    <!-- Solicitações Recentes -->
    <section class="sst-card">
      <header class="sst-card__toolbar">
        <h2 class="sst-card__title">Solicitações recentes</h2>
      </header>

      <div class="sst-table-wrapper">
        <table class="sst-table">
          <thead>
            <tr>
              <th scope="col">Tipo</th>
              <th scope="col">Descrição</th>
              <th scope="col">Status</th>
            </tr>
          </thead>
          <tbody>
            @for (req of requests; track req.description) {
              <tr>
                <td><strong>{{ req.type }}</strong></td>
                <td>{{ req.description }}</td>
                <td>
                  <span class="sst-badge" 
                        [class.sst-badge--ativo]="req.status === 'Concluída'"
                        [class.sst-badge--grupo]="req.status === 'Em andamento'">
                    {{ req.status }}
                  </span>
                </td>
              </tr>
            } @empty {
              <tr>
                <td colspan="3" class="sst-text-center">Nenhuma solicitação encontrada.</td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </section>
    
  </div>
</main>
